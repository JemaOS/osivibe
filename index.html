<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#757AED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Osivibe" />
  <meta name="application-name" content="Osivibe" />
  <meta name="description" content="Osivibe - Éditeur vidéo professionnel en ligne par Jema Technology" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Theme bootstrap: applied before CSS/JS to avoid a light/dark flash. -->
  <script>
    (function () {
      try {
        var key = 'osivibe-theme';
        var stored = window.localStorage.getItem(key);
        var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
        root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (error) {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  
  <!-- PWA Manifest (injecté automatiquement par vite-plugin-pwa) -->
  
  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  
  <!-- Polices auto-hébergées: aucune connexion tierce (voir /fonts + src/fonts.css) -->
  
  <title>Osivibe - Éditeur Vidéo</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Service Worker géré par vite-plugin-pwa -->
</body>

</html>
